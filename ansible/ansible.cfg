# Live-test harness Ansible configuration. Active when ansible runs from the
# ansible/ directory on the control node.
[defaults]
roles_path = roles
inventory = inventory
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = yaml
retry_files_enabled = False
forks = 10

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15
