---
# Shared delegated-driver create. Runs on the control node. Provisions one
# Hetzner Cloud server per platform with no public IPv4 (public IPv6 only, for
# package egress), a deterministic private address on the shared network, and
# the managed-node firewall. Writes the molecule instance config so converge
# and verify connect over the private network.
#
# The private address is assigned explicitly at attach time, so the connection
# detail does not depend on parsing a module return.
- name: Create
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ssh_key_name: livetest-harness
    network_name: livetest-net
    managed_firewall_name: livetest-fw-managed
    identity_file: /root/.ssh/livetest_harness
    managed_user: fedora
    private_base: "10.10.1."
    private_offset: 10
    # Boot from the enforcing base snapshot when the suite driver exports its id;
    # fall back to the catalogue image otherwise. A node booted from the base is
    # already enforcing, so the prepare-time setenforce becomes a no-op (no
    # mid-run permissive->enforcing flip, hence no transition AVC noise).
    base_image: "{{ lookup('env', 'LIVETEST_BASE_IMAGE') | default('', true) }}"
    # The stock cloud image is root-only, so cloud-init creates the unprivileged
    # connection account that the foundation maps to staff_u. PerSourcePenalties
    # is disabled so the harness reconnects do not lock out the control node.
    managed_user_data: |
      #cloud-config
      users:
        - name: {{ managed_user }}
          groups: [wheel]
          shell: /bin/bash
          sudo: "ALL=(ALL) NOPASSWD:ALL"
          ssh_authorized_keys:
            - "{{ lookup('file', identity_file + '.pub') }}"
      write_files:
        - path: /etc/ssh/sshd_config.d/99-livetest.conf
          content: |
            PerSourcePenalties no
            MaxStartups 100:30:200
      runcmd:
        - [bash, -c, "systemctl disable --now firewalld sshguard fail2ban 2>/dev/null || true"]
        - [systemctl, restart, sshd]
  tasks:
    - name: Provision one server per platform
      hetzner.hcloud.hcloud_server:
        name: "{{ item.name }}"
        server_type: "{{ item.server_type | default('cpx21') }}"
        image: "{{ base_image if base_image else (item.image | default('fedora-44')) }}"
        location: "{{ item.location | default('ash') }}"
        ssh_keys:
          - "{{ ssh_key_name }}"
        firewalls:
          - "{{ managed_firewall_name }}"
        enable_ipv4: false
        enable_ipv6: true
        user_data: "{{ managed_user_data }}"
        state: present
        labels:
          molecule: "1"
      loop: "{{ molecule_yml.platforms }}"

    - name: Attach each server to the private network at a fixed address
      hetzner.hcloud.hcloud_server_network:
        server: "{{ item.name }}"
        network: "{{ network_name }}"
        ip: "{{ private_base }}{{ private_offset + idx }}"
        state: present
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        index_var: idx

    - name: Build the molecule instance config
      ansible.builtin.set_fact:
        instance_conf: >-
          {{ instance_conf | default([]) + [{
            'instance': item.name,
            'address': private_base ~ (private_offset + idx),
            'user': managed_user,
            'port': 22,
            'identity_file': identity_file
          }] }}
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        index_var: idx

    - name: Wait for SSH on each private address
      ansible.builtin.wait_for:
        host: "{{ item.address }}"
        port: 22
        timeout: 600
        delay: 5
      loop: "{{ instance_conf }}"

    - name: Persist the instance config for molecule
      ansible.builtin.copy:
        content: "{{ instance_conf | to_json }}"
        dest: "{{ molecule_ephemeral_directory }}/instance_config.yml"
        mode: "0600"
