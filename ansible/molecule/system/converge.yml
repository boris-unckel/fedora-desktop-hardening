---
# System-tier converge: apply the cumulative cloud-testable topic set on one
# host, in bootstrap (P1 -> P2 -> P3) order. The boot-failure-class P1 topics
# run first, matching the documented bootstrap order and the risk model in
# livetest/topic-test-matrix.md. The foundation substrate is established by
# prepare.yml; each topic role re-asserts the foundation idempotently through
# its meta dependencies. Privileged tasks run in the role-switched sysadm_t
# context, matching the operator administration model.
#
# Session-dependent topics (keepassxc, mozilla_firefox, mozilla_thunderbird,
# flatpak_portal_cache) and the Wayland-session topic (staff_wayland_memfd) are
# excluded: they require a live user session the headless system node does not
# provide, and are handled by the phased session-effectiveness tier.
- name: Converge — apply the cumulative cloud-testable topic set
  hosts: all
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  # The topic list is shared with verify.yml -- see that file for why it is not
  # duplicated here.
  vars_files:
    - vars/system-tier-topics.yml
  vars:
    foundation_sudo_roles_user: "{{ ansible_user }}"
  tasks:
    - name: "Apply topic role: {{ item }}"
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop: "{{ system_tier_topics }}"
