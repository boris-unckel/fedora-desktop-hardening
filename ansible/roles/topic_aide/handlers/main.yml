---
# Handlers for topic_aide.
#
# Three notification channels:
#   "topic_aide cil changed"   — fires on a change to the CIL source
#                                 file. Triggers semodule install under
#                                 sysadm_r.
#   "topic_aide unit changed"  — fires on a change to either unit file
#                                 or to the optional push-banner.
#                                 Triggers restorecon, daemon-reload,
#                                 and a timer restart.
#   "topic_aide banner changed" — fires on a change to the push-banner
#                                 only. Triggers restorecon on the
#                                 banner file.

- name: "topic_aide | semodule install aide_extras"
  ansible.builtin.command:
    argv:
      - semodule
      - "-X"
      - "{{ topic_aide_cil_priority | string }}"
      - "-i"
      - "{{ topic_aide_cil_dir }}/{{ topic_aide_cil_module_name }}.cil"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_aide cil changed"

- name: "topic_aide | restorecon aide units"
  ansible.builtin.command:
    argv:
      - restorecon
      - "-v"
      - "{{ topic_aide_unit_dir }}/aide-check.service"
      - "{{ topic_aide_unit_dir }}/aide-check.timer"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_aide unit changed"

- name: "topic_aide | restorecon banner"
  ansible.builtin.command:
    argv:
      - restorecon
      - "-v"
      - "{{ topic_aide_profile_d_dir }}/aide-alert.sh"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_aide banner changed"

- name: "topic_aide | daemon-reload"
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "topic_aide unit changed"

- name: "topic_aide | restart aide-check.timer"
  ansible.builtin.systemd:
    name: "aide-check.timer"
    state: restarted
  listen: "topic_aide unit changed"
