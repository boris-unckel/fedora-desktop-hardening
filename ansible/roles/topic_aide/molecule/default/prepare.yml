---
# Component prepare: establish the substrate and the foundation tier. The
# shared play installs SELinux tooling, flips the node to enforcing, maps the
# connection user to staff_u, and applies the four foundation roles in order.
- name: Prepare the substrate and foundation tier
  ansible.builtin.import_playbook: ../../../../molecule/shared/foundation_prepare.yml

# The role deliberately does not run `aide --init`: the operator owns the
# baseline-content decision, so the first baseline is operator-driven and sits
# outside the idempotent flow. The live test stands in for that operator step
# here so the database-presence and database-triplet assertions have a baseline
# to check. The explicit chown/chmod pin the documented 0600 root:root triplet
# regardless of aide's build-time umask.
- name: Seed the AIDE baseline database (operator-owned step, simulated for the live test)
  hosts: all
  gather_facts: false
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  tasks:
    - name: "prepare | initialise the AIDE database baseline"
      ansible.builtin.shell: |
        set -euo pipefail
        aide --init
        mv -f /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
        chown root:root /var/lib/aide/aide.db.gz
        chmod 0600 /var/lib/aide/aide.db.gz
        restorecon -Fv /var/lib/aide/aide.db.gz
      args:
        executable: /bin/bash
        creates: /var/lib/aide/aide.db.gz
