---
# Preflight checks for topic_aide. Block apply when the host family is
# wrong, when the aide package is not installed, or when neither
# matchpathcon for the canonical /usr/bin/aide nor the package-installed
# /usr/sbin/aide resolves to aide_exec_t. Install-path fcontext checks,
# the nnp-class-equivalent stock-policy pre-test for the CIL
# rule, the AIDE-stream baseline recon, and the database-presence
# probe are non-fatal reports.

- name: "preflight | OS family check"
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'RedHat'
      - ansible_facts.distribution == 'Fedora'
      - ansible_facts.distribution_major_version | int >= 44
    fail_msg: >
      topic_aide targets Fedora 44 or later. Detected:
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }}.

- name: "preflight | required package present"
  ansible.builtin.command:
    argv:
      - rpm
      - "-q"
      - "{{ item }}"
  register: req_pkg_check
  changed_when: false
  failed_when: req_pkg_check.rc != 0
  loop: "{{ topic_aide_required_packages }}"

- name: "preflight | matchpathcon canonical {{ topic_aide_binary_canonical }}"
  ansible.builtin.command:
    argv:
      - matchpathcon
      - "{{ topic_aide_binary_canonical }}"
  register: matchpathcon_canonical
  changed_when: false
  failed_when: false

- name: "preflight | matchpathcon pre-merge {{ topic_aide_binary_pre_merge }}"
  ansible.builtin.command:
    argv:
      - matchpathcon
      - "{{ topic_aide_binary_pre_merge }}"
  register: matchpathcon_pre_merge
  changed_when: false
  failed_when: false

- name: "preflight | fail-fast when neither matchpathcon resolves to {{ topic_aide_expected_fcontext }}"
  ansible.builtin.fail:
    msg: |
      Neither matchpathcon path resolved to {{ topic_aide_expected_fcontext }}:
        {{ topic_aide_binary_canonical }} -> {{ matchpathcon_canonical.stdout | trim }}
        {{ topic_aide_binary_pre_merge }}  -> {{ matchpathcon_pre_merge.stdout | trim }}
      The kernel SELinux type-transition init_t -> {{ topic_aide_expected_selinux_domain }} relies
      on {{ topic_aide_expected_fcontext }} being the canonical-side label. The manifest needs
      revision before applying this role.
  when:
    - (matchpathcon_canonical.stdout | regex_search(topic_aide_expected_fcontext)) is none
    - (matchpathcon_pre_merge.stdout | regex_search(topic_aide_expected_fcontext)) is none

- name: "preflight | report matchpathcon outcome"
  ansible.builtin.debug:
    msg: >
      matchpathcon canonical={{ matchpathcon_canonical.stdout | trim }};
      pre-merge={{ matchpathcon_pre_merge.stdout | trim }}.

- name: "preflight | matchpathcon service unit path"
  ansible.builtin.command:
    argv:
      - matchpathcon
      - "{{ topic_aide_unit_dir }}/aide-check.service"
  register: matchpathcon_service_unit
  changed_when: false
  failed_when: false

- name: "preflight | matchpathcon timer unit path"
  ansible.builtin.command:
    argv:
      - matchpathcon
      - "{{ topic_aide_unit_dir }}/aide-check.timer"
  register: matchpathcon_timer_unit
  changed_when: false
  failed_when: false

- name: "preflight | fail-fast when unit paths do not resolve to {{ topic_aide_expected_unit_seltype }}"
  ansible.builtin.fail:
    msg: |
      matchpathcon for an aide unit-file path returned an unexpected mapping:
        {{ topic_aide_unit_dir }}/aide-check.service -> {{ matchpathcon_service_unit.stdout | trim }}
        {{ topic_aide_unit_dir }}/aide-check.timer   -> {{ matchpathcon_timer_unit.stdout | trim }}
      Expected: {{ topic_aide_expected_unit_seltype }}.
  when:
    - (matchpathcon_service_unit.stdout | regex_search(topic_aide_expected_unit_seltype)) is none
      or (matchpathcon_timer_unit.stdout | regex_search(topic_aide_expected_unit_seltype)) is none

- name: "preflight | matchpathcon CIL publish path"
  ansible.builtin.command:
    argv:
      - matchpathcon
      - "{{ topic_aide_cil_dir }}/{{ topic_aide_cil_module_name }}.cil"
  register: matchpathcon_cil
  changed_when: false
  failed_when: false

- name: "preflight | fail-fast when CIL path does not resolve to usr_t"
  ansible.builtin.fail:
    msg: |
      matchpathcon {{ topic_aide_cil_dir }}/{{ topic_aide_cil_module_name }}.cil returned
      an unexpected mapping: {{ matchpathcon_cil.stdout | trim }}.
      Expected: usr_t.
  when:
    - (matchpathcon_cil.stdout | regex_search('usr_t')) is none

- name: "preflight | matchpathcon banner path"
  ansible.builtin.command:
    argv:
      - matchpathcon
      - "{{ topic_aide_profile_d_dir }}/aide-alert.sh"
  register: matchpathcon_banner
  changed_when: false
  failed_when: false
  when: topic_aide_install_alert_banner | bool

- name: "preflight | fail-fast when banner path does not resolve to bin_t"
  ansible.builtin.fail:
    msg: |
      matchpathcon {{ topic_aide_profile_d_dir }}/aide-alert.sh returned
      an unexpected mapping: {{ matchpathcon_banner.stdout | trim }}.
      Expected: bin_t.
  when:
    - topic_aide_install_alert_banner | bool
    - (matchpathcon_banner.stdout | default('') | regex_search('bin_t')) is none

- name: "preflight | SELinux pre-test rule 1 (aide_t -> dosfs_t : filesystem getattr; expected empty)"
  ansible.builtin.command:
    argv:
      - sesearch
      - "-A"
      - "-s"
      - "{{ topic_aide_expected_selinux_domain }}"
      - "-t"
      - "dosfs_t"
      - "-c"
      - "filesystem"
      - "-p"
      - "getattr"
  register: pretest_rule1
  changed_when: false
  failed_when: false
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"

- name: "preflight | report SELinux pre-test outcome (rule 1)"
  ansible.builtin.debug:
    msg: >
      SELinux pre-test for
      {{ topic_aide_expected_selinux_domain }} -> dosfs_t : filesystem getattr:
      {{ 'EMPTY (expected; topic CIL rule 1 is required and will be installed)'
         if (pretest_rule1.stdout | trim) == '' else
         'NON-EMPTY (the rule is already in policy; topic CIL install at '
         + 'priority 400 is idempotent and overlays without harm)' }}.

- name: "preflight | AIDE-stream baseline recon"
  ansible.builtin.shell: |
    set +e
    rpm -q aide
    ausearch -m AVC -ts boot 2>/dev/null \
      | grep -E 'aide_t|aide_exec_t' | head -20
    ls -laZ {{ topic_aide_db_dir }} 2>/dev/null
    systemctl is-active aide-check.timer 2>/dev/null
    exit 0
  args:
    executable: /bin/bash
  register: baseline_recon
  changed_when: false
  failed_when: false
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"

- name: "preflight | report AIDE-stream baseline recon"
  ansible.builtin.debug:
    msg: >
      AIDE-stream baseline (non-fatal; a non-empty AVC stream against
      aide_t on a vanilla host indicates a previous incomplete deployment
      and signals the operator to clean up before redeploying):
      {{ baseline_recon.stdout | trim }}.

- name: "preflight | database presence probe"
  ansible.builtin.stat:
    path: "{{ topic_aide_db_path }}"
  register: db_stat
  changed_when: false
