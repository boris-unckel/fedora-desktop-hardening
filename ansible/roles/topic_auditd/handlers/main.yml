---
# Handlers for topic_auditd.
#
# Three handlers — never four. auditd's stock vendor unit ships
# RefuseManualStop=yes, so `systemctl restart auditd` is structurally
# unavailable (the stop step of the stop-then-start sequence is refused).
# Drop-in changes activate only on reboot; the role's tasks/main.yml
# ends with a pause: that prompts the operator for a reboot.
#
# Two notification channels:
#   "topic_auditd cil changed"    — fires on a change to the CIL source
#                                    file. Triggers semodule install
#                                    under sysadm_r.
#   "topic_auditd dropin changed" — fires on a change to either drop-in
#                                    file. Triggers restorecon and
#                                    daemon-reload (no restart handler).

- name: "topic_auditd | semodule install nnp_auditd"
  ansible.builtin.command:
    argv:
      - semodule
      - "-X"
      - "{{ topic_auditd_cil_priority | string }}"
      - "-i"
      - "{{ topic_auditd_cil_dir }}/{{ topic_auditd_cil_module_name }}.cil"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_auditd cil changed"

- name: "topic_auditd | restorecon auditd drop-ins"
  # -R so the drop-in directory itself is relabelled, not only the files
  # inside it. The directory is created by this role and takes its context
  # from the parent directory at creation time; no later step revisits it.
  # -F additionally resets the SELinux user field. Without it every path
  # keeps the user identity of whoever applied the role, and that drift is
  # invisible to `restorecon -n`, which compares the type alone.
  ansible.builtin.command:
    argv:
      - restorecon
      - "-F"
      - "-v"
      - "-R"
      - "{{ topic_auditd_dropin_dir }}"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_auditd dropin changed"

- name: "topic_auditd | daemon-reload"
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "topic_auditd dropin changed"
