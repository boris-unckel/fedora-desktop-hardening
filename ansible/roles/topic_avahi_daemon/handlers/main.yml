---
# Handlers for topic_avahi_daemon.
#
# Two notification channels:
#   "topic_avahi_daemon cil changed"    — fires on a change to the CIL
#                                          source file. Triggers semodule
#                                          install under sysadm_r.
#   "topic_avahi_daemon dropin changed" — fires on a change to either drop-
#                                          in file. Triggers restorecon,
#                                          daemon-reload, and a unit
#                                          restart.

- name: "topic_avahi_daemon | semodule install nnp_avahi_daemon"
  ansible.builtin.command:
    argv:
      - semodule
      - "-X"
      - "{{ topic_avahi_daemon_cil_priority | string }}"
      - "-i"
      - "{{ topic_avahi_daemon_cil_dir }}/{{ topic_avahi_daemon_cil_module_name }}.cil"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_avahi_daemon cil changed"

- name: "topic_avahi_daemon | restorecon avahi-daemon drop-ins"
  ansible.builtin.command:
    argv:
      - restorecon
      - "-v"
      - "{{ topic_avahi_daemon_dropin_dir }}/99-hardening.conf"
      - "{{ topic_avahi_daemon_dropin_dir }}/99-nnp.conf"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_avahi_daemon dropin changed"

- name: "topic_avahi_daemon | daemon-reload"
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "topic_avahi_daemon dropin changed"

- name: "topic_avahi_daemon | restart avahi-daemon"
  ansible.builtin.systemd:
    name: "avahi-daemon.service"
    state: restarted
  listen: "topic_avahi_daemon dropin changed"
