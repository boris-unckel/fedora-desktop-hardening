---
# Tunables for topic_chronyd. Override in group_vars or playbook.

# Drop-in directory for chronyd.service.
topic_chronyd_dropin_dir: "/etc/systemd/system/chronyd.service.d"

# Priority-400 CIL publish directory.
topic_chronyd_cil_dir: "/usr/local/share/selinux"

# Required package: the daemon, the chronyc client, the unit file.
topic_chronyd_required_packages:
  - chrony

# Capabilities the topic asserts as absent in the resolved
# CapabilityBoundingSet of the running unit. The end-state assumes an
# NTS-client-only chrony configuration; server-mode features that depend
# on any of these capabilities are out of topic scope.
topic_chronyd_expected_forbidden_caps:
  - cap_net_admin
  - cap_net_bind_service
  - cap_net_broadcast
  - cap_net_raw

# Expected effective values surfaced from `systemctl show --value`.
topic_chronyd_expected_selinux_domain: "chronyd_t"
topic_chronyd_expected_procsubset: "pid"
topic_chronyd_expected_umask: "0027"
topic_chronyd_expected_syscall_architectures: "native"
topic_chronyd_expected_nnp: "yes"

# Topic-owned CIL module name and load priority.
topic_chronyd_cil_module_name: "nnp_chronyd"
topic_chronyd_cil_priority: 400
