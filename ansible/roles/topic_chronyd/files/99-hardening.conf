[Service]
# Drop only CAP_NET_ADMIN. The live test showed chronyd fails to start without
# CAP_NET_BIND_SERVICE / CAP_NET_BROADCAST / CAP_NET_RAW (it binds the NTP
# socket and uses them during startup even in client mode), so those stay in the
# bounding set; CAP_NET_ADMIN is the one networking capability chronyd does not
# need and is safely removed. A single leading "~" makes the whole line
# subtractive.
CapabilityBoundingSet=~CAP_NET_ADMIN
ProcSubset=pid
UMask=0027
SystemCallArchitectures=native
