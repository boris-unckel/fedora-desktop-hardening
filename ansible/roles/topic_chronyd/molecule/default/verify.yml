---
# Verify: run the role-shipped verify.sh in both SELinux contexts. The plain
# staff_t pass reports sysadm_t-gated checks as SKIP; the role-switched
# sysadm_t pass turns them into real checks. Both passes must exit 0.
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: verify.sh in the staff_t context (no role switch)
      ansible.builtin.script: ../../files/verify.sh
      become: false
      changed_when: false
      failed_when: false
      register: verify_staff

    - name: Report the staff_t pass
      ansible.builtin.debug:
        var: verify_staff.stdout_lines

    - name: verify.sh in the sysadm_t context (role switch)
      ansible.builtin.script: ../../files/verify.sh
      become: true
      become_flags: "-r sysadm_r -t sysadm_t"
      changed_when: false
      failed_when: false
      register: verify_sysadm

    - name: Report the sysadm_t pass
      ansible.builtin.debug:
        var: verify_sysadm.stdout_lines

    - name: Both contexts must exit 0
      ansible.builtin.assert:
        that:
          - verify_staff.rc == 0
          - verify_sysadm.rc == 0
        success_msg: "verify.sh clean in staff_t and sysadm_t"
        fail_msg: >-
          verify drift: staff_t rc={{ verify_staff.rc }},
          sysadm_t rc={{ verify_sysadm.rc }}
