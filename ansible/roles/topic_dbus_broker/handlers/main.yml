---
# Handlers for topic_dbus_broker.
#
# Two notification channels:
#   "topic_dbus_broker cil changed"    — fires on a change to the CIL
#                                         source file. Triggers semodule
#                                         install under sysadm_r.
#   "topic_dbus_broker dropin changed" — fires on a change to either drop-
#                                         in file. Triggers restorecon,
#                                         daemon-reload, and a unit
#                                         restart.

- name: "topic_dbus_broker | semodule install nnp_dbus_broker"
  ansible.builtin.command:
    argv:
      - semodule
      - "-X"
      - "{{ topic_dbus_broker_cil_priority | string }}"
      - "-i"
      - "{{ topic_dbus_broker_cil_dir }}/{{ topic_dbus_broker_cil_module_name }}.cil"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_dbus_broker cil changed"

- name: "topic_dbus_broker | restorecon dbus-broker drop-ins"
  ansible.builtin.command:
    argv:
      - restorecon
      - "-v"
      - "{{ topic_dbus_broker_dropin_dir }}/99-hardening.conf"
      - "{{ topic_dbus_broker_dropin_dir }}/99-nnp.conf"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_dbus_broker dropin changed"

- name: "topic_dbus_broker | daemon-reload"
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "topic_dbus_broker dropin changed"

- name: "topic_dbus_broker | restart dbus-broker"
  ansible.builtin.systemd:
    name: "dbus-broker.service"
    state: restarted
  listen: "topic_dbus_broker dropin changed"
