---
# Tunables for topic_flatpak_audio_sandbox. Override in group_vars or playbook.

# Required packages on Fedora 44+. Preflight asserts presence; the role
# fail-fasts on a missing entry. The topic is structurally inapplicable
# without the flatpak CLI and the bubblewrap sandbox-construction binary.
topic_flatpak_audio_sandbox_required_packages:
  - flatpak
  - bubblewrap

# Operator-mapping applicability anchor. Plain unconfined_u logins do
# not exercise the gap; the role aborts as a clean no-op on those hosts.
topic_flatpak_audio_sandbox_expected_seuser_substring: "staff_u"

# Identity of a priority-400 module that would duplicate the stock grant.
# The role removes it where it is installed; the end-state carries none.
topic_flatpak_audio_sandbox_cil_module_name: "flatpak_audio_sandbox"
topic_flatpak_audio_sandbox_cil_priority: 400

# Operator-side CIL source files of that module. Removed when present.
topic_flatpak_audio_sandbox_stale_source_paths:
  - "/root/flatpak_audio_sandbox.cil"
  - "/root/flatpak_audio_sandbox.cil.pre-reinstall"

# Per-application permission substring used by preflight to count
# audio-permission-holding Flatpak applications. Tunable for a future
# Flatpak-permission-name change.
topic_flatpak_audio_sandbox_audio_permission_substring: "pulseaudio"

# Expected end-state values surfaced from the verify discipline.
topic_flatpak_audio_sandbox_expected_module_installed: "no"
topic_flatpak_audio_sandbox_expected_rule_present: "yes"
topic_flatpak_audio_sandbox_expected_avc_class_since_boot: "0"
