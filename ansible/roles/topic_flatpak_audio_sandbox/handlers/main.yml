# Handlers for topic_flatpak_audio_sandbox.
#
# This role ships no handlers. The modify stage runs an ansible.builtin.copy
# of the CIL source under /root/ followed by a creates-guarded
# `semodule -X 400 -i` invocation; SELinux access checks evaluate the
# loaded policy on each system call, so a subsequent `flatpak run` from
# the operator's shell picks up the new allow rule without restart and
# no daemon-reload, restorecon, or service restart needs to fire. The
# file is present for skeleton consistency.
