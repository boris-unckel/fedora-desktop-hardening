---
# Role: topic_flatpak_audio_sandbox
# Pattern: Preflight -> Modify (remove the topic module if present) -> Assert -> Verify
# Idempotent: yes (on a host in the end-state the module is absent, the
# source files are absent, and every task reports no change). See README.md
# "Idempotence notes".
#
# End-state: the allow surface staff_t × device_t : dir mounton comes from
# the stock targeted policy (dev_mounton(staff_t) in policy/modules/roles/
# staff.te, shipped with selinux-policy 44.2 on Fedora 44). The role ships no
# policy of its own. It removes a priority-400 module named
# flatpak_audio_sandbox where one is installed, because that module would
# duplicate the stock grant, and it asserts the stock grant is present.
#
# Modify ordering invariant:
#   1. Preflight (OS family, package presence, operator-mapping
#      applicability gate, audio-flatpak inventory recon, pre-change
#      sanity baseline).
#   2. Remove the priority-400 module slot when it exists.
#   3. Remove the operator-side CIL source files under /root/ when present.
#   4. sesearch asserts the allow surface is present in the loaded policy.
#
# No drop-in push step. No semanage fcontext. No restorecon. No
# systemctl daemon-reload. No service restart. No flatpak run trigger
# from inside the role.

- name: "topic_flatpak_audio_sandbox | preflight"
  ansible.builtin.import_tasks: preflight.yml
  tags:
    - topic_flatpak_audio_sandbox
    - preflight

- name: "topic_flatpak_audio_sandbox | probe (read-only)"
  ansible.builtin.script: "files/probe.sh"
  changed_when: false
  failed_when: false
  register: probe_result
  tags:
    - topic_flatpak_audio_sandbox
    - probe

- name: "topic_flatpak_audio_sandbox | apply configuration"
  block:

    - name: "topic_flatpak_audio_sandbox | check for a priority-{{ topic_flatpak_audio_sandbox_cil_priority }} module slot"
      ansible.builtin.stat:
        path: "/var/lib/selinux/targeted/active/modules/{{ topic_flatpak_audio_sandbox_cil_priority }}/{{ topic_flatpak_audio_sandbox_cil_module_name }}/cil"
      register: existing_module_slot
      become: true
      become_flags: "-r sysadm_r -t sysadm_t"

    - name: "topic_flatpak_audio_sandbox | remove the priority-{{ topic_flatpak_audio_sandbox_cil_priority }} module (duplicates the stock grant)"
      ansible.builtin.command:
        argv:
          - semodule
          - "-X"
          - "{{ topic_flatpak_audio_sandbox_cil_priority }}"
          - "-r"
          - "{{ topic_flatpak_audio_sandbox_cil_module_name }}"
      changed_when: true
      become: true
      become_flags: "-r sysadm_r -t sysadm_t"
      when: existing_module_slot.stat.exists | default(false)

    - name: "topic_flatpak_audio_sandbox | remove operator-side CIL source files"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ topic_flatpak_audio_sandbox_stale_source_paths }}"
      become: true
      become_flags: "-r sysadm_r -t sysadm_t"

    - name: "topic_flatpak_audio_sandbox | sesearch on functional surface"
      ansible.builtin.command:
        argv:
          - sesearch
          - "-A"
          - "-s"
          - "staff_t"
          - "-t"
          - "device_t"
          - "-c"
          - "dir"
          - "-p"
          - "mounton"
      register: post_rule
      changed_when: false
      become: true
      become_flags: "-r sysadm_r -t sysadm_t"

    - name: "topic_flatpak_audio_sandbox | assert the stock allow surface is present"
      ansible.builtin.assert:
        that:
          - (post_rule.stdout | length) > 0
        fail_msg: |
          flatpak-audio-sandbox: the loaded policy carries no allow on
          staff_t × device_t : dir mounton. The stock targeted policy grants
          it through dev_mounton(staff_t) from selinux-policy 44.2 on Fedora
          44. Update selinux-policy-targeted; if the current package lacks
          the grant, the recovery path in the topic Reference applies.

    - name: "topic_flatpak_audio_sandbox | report end-state"
      ansible.builtin.debug:
        msg: |
          flatpak-audio-sandbox end-state snapshot:
          rule_present={{ (post_rule.stdout | length) > 0 }},
          topic_module_removed={{ existing_module_slot.stat.exists | default(false) }}.

  rescue:

    - name: "topic_flatpak_audio_sandbox | apply failed; do not auto-rollback"
      ansible.builtin.fail:
        msg: |
          topic_flatpak_audio_sandbox apply step failed. The role ships no
          policy, so there is nothing to roll back; the failing check names
          the missing piece. Boot-failure risk for this topic is
          structurally zero — the allow surface concerns a user-process-side
          bind-mount step performed by bwrap from a desktop role that is not
          active during the boot sequence.

  tags:
    - topic_flatpak_audio_sandbox
    - apply

- name: "topic_flatpak_audio_sandbox | verify (Soll/Ist)"
  ansible.builtin.script: "files/verify.sh"
  changed_when: false
  register: verify_result
  failed_when: verify_result.rc != 0
  tags:
    - topic_flatpak_audio_sandbox
    - verify
