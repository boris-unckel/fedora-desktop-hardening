---
# Role: topic_flatpak_collection_id
# Pattern: Preflight -> Probe -> Per-remote modify -> Conditional AppStream
# refresh -> Post-modify verify
# Idempotent: yes (re-applying must not change state on a correctly
# configured host; the per-remote `flatpak remote-modify` call is a
# Flatpak-internal no-op when the targeted remote already carries the
# configured binding, and the AppStream refresh is gated on at least one
# per-remote modify reporting changed=true)
#
# Modify ordering invariant:
#   1. Preflight: OS family, package presence, system-store presence,
#      operator-mapping note, remote-inventory enumeration, pre-modify
#      config-file read under sysadm_t, pre-modify dry-run line-count,
#      identification of ostree-typed remotes targeted by this run.
#   2. Probe (read-only): files/probe.sh.
#   3. Per-remote modify loop: for each <remote>: <binding> entry in the
#      mapping that names a remote present on the host, run
#      `flatpak remote-modify --collection-id=<binding> <remote>` via
#      ansible.builtin.command under become with sysadm_r/sysadm_t. The
#      `changed_when` predicate re-reads the config file after the call
#      and reports changed=true only if the targeted remote's
#      collection-id= line was added or modified.
#   4. Conditional AppStream refresh: run
#      `flatpak update --appstream` exactly once if at least one per-remote
#      modify in this run reported changed=true. Encoded via a registered
#      fact (`__topic_flatpak_collection_id_any_changed`) consulted by the
#      task's `when:` clause, NOT via an Ansible handler.
#   5. Post-modify verify: files/verify.sh asserts the per-remote
#      collection-id= line is present in the config file for every
#      targeted remote, and the dry-run non-fatal-fetch-warning count is
#      zero.
#
# No drop-in push step. No CIL-module install. No daemon-reload. No
# restorecon. No semanage fcontext. No system-bus systemctl restart. No
# per-user systemctl --user restart. No invocation of `flatpak repair
# --system` from inside the role.

- name: "topic_flatpak_collection_id | preflight"
  ansible.builtin.import_tasks: preflight.yml
  tags:
    - topic_flatpak_collection_id
    - preflight

- name: "topic_flatpak_collection_id | probe (read-only)"
  ansible.builtin.script: "files/probe.sh"
  changed_when: false
  failed_when: false
  register: probe_result
  tags:
    - topic_flatpak_collection_id
    - probe

- name: "topic_flatpak_collection_id | apply configuration"
  block:

    - name: "topic_flatpak_collection_id | initialize change-aggregate fact"
      ansible.builtin.set_fact:
        __topic_flatpak_collection_id_any_changed: false

    - name: "topic_flatpak_collection_id | per-remote modify loop"
      ansible.builtin.shell: >
        before=$(grep -A1 '^\[remote "{{ item.key }}"\]'
                 {{ topic_flatpak_collection_id_repo_config_path
                    | quote }}
                 | grep -E '^collection-id=' || true) ;
        flatpak remote-modify --collection-id={{ item.value | quote }}
                              {{ item.key | quote }} ;
        rc=$? ;
        after=$(grep -A1 '^\[remote "{{ item.key }}"\]'
                {{ topic_flatpak_collection_id_repo_config_path
                   | quote }}
                | grep -E '^collection-id=' || true) ;
        if [ "$before" = "$after" ]; then
          echo "UNCHANGED: $after" ;
        else
          echo "CHANGED: before='$before' after='$after'" ;
        fi ;
        exit "$rc"
      register: remote_modify_result
      changed_when: "'CHANGED:' in remote_modify_result.stdout"
      failed_when: remote_modify_result.rc != 0
      become: true
      become_flags: "-r sysadm_r -t sysadm_t"
      loop: "{{ __topic_flatpak_collection_id_targets | default([]) }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"

    - name: "topic_flatpak_collection_id | aggregate change signal"
      ansible.builtin.set_fact:
        __topic_flatpak_collection_id_any_changed: true
      when:
        - remote_modify_result is defined
        - remote_modify_result.results
            | default([])
            | selectattr('changed', 'equalto', true)
            | list
            | length > 0

    - name: "topic_flatpak_collection_id | conditional AppStream refresh"
      ansible.builtin.command:
        argv:
          - flatpak
          - update
          - "--appstream"
      register: appstream_refresh
      changed_when: "__topic_flatpak_collection_id_any_changed | bool"
      failed_when: appstream_refresh.rc != 0
      become: true
      become_flags: "-r sysadm_r -t sysadm_t"
      when:
        - __topic_flatpak_collection_id_any_changed | bool

    - name: "topic_flatpak_collection_id | report end-state"
      ansible.builtin.debug:
        msg: |
          flatpak-collection-id repair issued under sysadm_t against
          {{ topic_flatpak_collection_id_repo_config_path }} for the
          remotes named in topic_flatpak_collection_id_remote_bindings
          that are configured on this host. AppStream refresh:
          {% if __topic_flatpak_collection_id_any_changed | bool %}
          executed (at least one per-remote modify reported changed).
          {% else %}
          skipped (every targeted remote already carried the configured
          binding; no per-remote change was applied).
          {% endif %}

  rescue:

    - name: "topic_flatpak_collection_id | modify failed; do not auto-rollback"
      ansible.builtin.fail:
        msg: |
          topic_flatpak_collection_id modify step failed. Auto-rollback is
          not defined for this Topic. The per-remote rollback verb (the
          empty-string call `flatpak remote-modify --collection-id="" <remote>`
          under sysadm_t) is the operator's deliberate decision and is
          documented in the Topic's Reference under Recovery. Boot-failure
          risk is structurally zero (the per-remote configuration file is
          consulted only at flatpak-CLI invocation time and is not part of
          the system-init pipeline).

  tags:
    - topic_flatpak_collection_id
    - apply

- name: "topic_flatpak_collection_id | flush handlers before verify"
  ansible.builtin.meta: flush_handlers
  tags:
    - topic_flatpak_collection_id
    - apply

- name: "topic_flatpak_collection_id | verify (Soll/Ist)"
  ansible.builtin.script: "files/verify.sh"
  changed_when: false
  register: verify_result
  failed_when: verify_result.rc != 0
  tags:
    - topic_flatpak_collection_id
    - verify
