---
# Tunables for topic_flatpak_kfd_device. Override in group_vars or playbook.

# Required packages on Fedora 44+. Preflight asserts presence; the role
# fail-fasts on a missing entry. The topic is structurally inapplicable
# without the flatpak CLI and the bubblewrap sandbox-construction binary.
topic_flatpak_kfd_device_required_packages:
  - flatpak
  - bubblewrap

# Operator-mapping applicability anchor. Plain unconfined_u logins do
# not exercise the gap; the role aborts as a clean no-op on those hosts.
topic_flatpak_kfd_device_expected_seuser_substring: "staff_u"

# CIL module identity. The priority-400 publish path is provisioned by
# foundation_selinux_cil_bootstrap.
topic_flatpak_kfd_device_cil_module_name: "flatpak_kfd_device"
topic_flatpak_kfd_device_cil_priority: 400
topic_flatpak_kfd_device_cil_source_path: "/root/flatpak_kfd_device.cil"
topic_flatpak_kfd_device_cil_source_backup_path: "/root/flatpak_kfd_device.cil.pre-reinstall"

# Device node whose bind-source stat the functional rule keeps
# operational. Exposed by the amdgpu kernel driver on AMD-GPU hosts;
# absent on other GPU vendors and on typical headless cloud nodes
# (the gap is then unreachable and the patch is applied pre-emptively).
topic_flatpak_kfd_device_node_path: "/dev/kfd"

# Per-application permission substring used by preflight to count
# dri-permission-holding Flatpak applications. Tunable for a future
# Flatpak-permission-name change.
topic_flatpak_kfd_device_dri_permission_substring: "dri"

# Expected end-state values surfaced from the verify discipline.
topic_flatpak_kfd_device_expected_module_installed: "yes"
topic_flatpak_kfd_device_expected_rule_present: "yes"
