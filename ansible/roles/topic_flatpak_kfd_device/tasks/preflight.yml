---
# Preflight checks for topic_flatpak_kfd_device. Block apply when the
# host family is wrong, when any of the required packages are missing,
# or when the operator's runtime SELinux mapping is not staff_u. Mark
# the apply step as a clean no-op when the allow surface is already
# present in the loaded policy (the workaround-obsolescence path: a
# future stock-policy update has shipped an equivalent grant and the
# topic-owned module is no longer required). Emit an informational note
# when the host does not expose the /dev/kfd node — the gap is then
# unreachable, but pre-applying the policy patch protects a future
# hardware change. Emit a second informational note when the Flatpak
# inventory contains no application declaring the dri device permission.

- name: "preflight | OS family check"
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'RedHat'
      - ansible_facts.distribution == 'Fedora'
      - ansible_facts.distribution_major_version | int >= 44
    fail_msg: >
      topic_flatpak_kfd_device targets Fedora 44 or later. Detected:
      {{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_major_version }}.

- name: "preflight | required packages present"
  ansible.builtin.command:
    argv:
      - rpm
      - "-q"
      - "{{ item }}"
  register: req_pkg_check
  changed_when: false
  failed_when: req_pkg_check.rc != 0
  loop: "{{ topic_flatpak_kfd_device_required_packages }}"

- name: "preflight | operator runtime SELinux mapping"
  ansible.builtin.command:
    argv:
      - id
      - "-Z"
  register: id_z_result
  changed_when: false
  failed_when: false

- name: "preflight | applicability gate on operator mapping"
  ansible.builtin.fail:
    msg: |
      flatpak-kfd-device: operator runtime SELinux mapping does not
      match the applicability anchor
      ('{{ topic_flatpak_kfd_device_expected_seuser_substring }}').
      Detected: '{{ id_z_result.stdout | trim }}'.
      The stock-policy gap is reachable only from the staff_u → staff_r
      → staff_t desktop role-stack; an unconfined_u operator does not
      exercise the gap and does not need this topic.
  when:
    - topic_flatpak_kfd_device_expected_seuser_substring
        not in (id_z_result.stdout | default(''))

- name: "preflight | device-node presence"
  ansible.builtin.stat:
    path: "{{ topic_flatpak_kfd_device_node_path }}"
  register: kfd_node_stat
  changed_when: false
  failed_when: false
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"

- name: "preflight | report node-absent informational note"
  ansible.builtin.debug:
    msg: |
      flatpak-kfd-device: the host does not expose
      {{ topic_flatpak_kfd_device_node_path }} (no AMD GPU, or the
      amdgpu driver is not loaded). The stock-policy gap is currently
      unreachable on this host; Flatpak only binds existing nodes. The
      policy patch is applied pre-emptively so a future hardware change
      does not surface the gap.
  when:
    - not (kfd_node_stat.stat.exists | default(false))

- name: "preflight | enumerate flatpak application inventory"
  ansible.builtin.command:
    argv:
      - flatpak
      - list
      - "--columns=application,permissions"
  register: flatpak_apps_result
  changed_when: false
  failed_when: false

- name: "preflight | count dri-permission-holding flatpak applications"
  ansible.builtin.set_fact:
    topic_flatpak_kfd_device_dri_app_count: >-
      {{ (flatpak_apps_result.stdout_lines | default([]))
         | select('search', topic_flatpak_kfd_device_dri_permission_substring)
         | list
         | length }}

- name: "preflight | report no-dri-flatpak informational note"
  ansible.builtin.debug:
    msg: |
      flatpak-kfd-device: no Flatpak application holding the
      '{{ topic_flatpak_kfd_device_dri_permission_substring }}'
      device permission is currently installed. The stock-policy gap is
      currently unreachable through the application inventory. The
      policy patch is applied pre-emptively so a future application
      install (any Flatpak manifest declaring `--device=dri` or
      `--device=all`) does not surface the gap.
  when:
    - (topic_flatpak_kfd_device_dri_app_count | int) == 0

- name: "preflight | pre-load sesearch on functional surface"
  ansible.builtin.command:
    argv:
      - sesearch
      - "-A"
      - "-s"
      - "staff_t"
      - "-t"
      - "hsa_device_t"
      - "-c"
      - "chr_file"
      - "-p"
      - "getattr"
  register: pre_rule
  changed_when: false
  failed_when: false
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"

- name: "preflight | compute workaround-obsolescence flag"
  ansible.builtin.set_fact:
    topic_flatpak_kfd_device_already_closed: >-
      {{ ((pre_rule.stdout | default('')) | length) > 0 }}

- name: "preflight | report workaround-obsolescence disposition"
  ansible.builtin.debug:
    msg: |
      flatpak-kfd-device: the allow surface is already present in the
      loaded policy. A future stock-policy update has shipped the
      equivalent grant; the topic-owned module is not required and the
      apply stage will skip the CIL push as a clean no-op.
  when:
    - topic_flatpak_kfd_device_already_closed | bool

- name: "preflight | pre-hardening sanity baseline (non-fatal capture)"
  ansible.builtin.shell: |
    set +e
    rpm -q flatpak bubblewrap
    flatpak --version
    ls -lZ {{ topic_flatpak_kfd_device_node_path }} 2>&1 || true
    id -Z
    semodule -lfull | grep -wE '^[ ]*400.*flatpak_kfd_device' || echo '(module not installed)'
    sesearch -A -s staff_t -t hsa_device_t -c chr_file 2>&1 || true
    exit 0
  args:
    executable: /bin/bash
  register: preflight_sanity_recon
  changed_when: false
  failed_when: false
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"

- name: "preflight | report pre-hardening sanity baseline"
  ansible.builtin.debug:
    msg: >
      Pre-deploy flatpak-kfd-device state snapshot (non-fatal capture):
      {{ preflight_sanity_recon.stdout | trim }}.
