---
# Component prepare: establish the substrate and the foundation tier. The
# shared play installs SELinux tooling, flips the node to enforcing, maps the
# connection user to staff_u, and applies the four foundation roles in order.
- name: Prepare the substrate and foundation tier
  ansible.builtin.import_playbook: ../../../../molecule/shared/foundation_prepare.yml

# No topic precondition is seeded here. Exercising topic_gnupg_pinentry_dbus
# needs an operator-selected pinentry-gnome3 entry in the connection user's
# ~/.gnupg/gpg-agent.conf, but that file is labelled gpg_secret_t and the
# role's preflight read of it does not succeed from the harness context, so a
# seeded file does not make the topic green here. The topic is therefore
# applicability-gated on a generic headless host (P3, presence-only): its
# preflight correctly gates out, and real effectiveness belongs to the phased
# session-effectiveness tier with a live gpg-agent under the staff_u session.
