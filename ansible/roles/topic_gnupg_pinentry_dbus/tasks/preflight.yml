---
# Preflight checks for topic_gnupg_pinentry_dbus. Block apply when the
# host family is wrong, when any of the four required packages are
# missing, when the operator's runtime SELinux mapping is not staff_u,
# or when the operator has selected a non-GNOME pinentry helper. Mark
# the apply step as a clean no-op when both allow surfaces are already
# present in the loaded policy (the workaround-obsolescence path: a
# future stock-policy update has shipped equivalent grants and the
# topic-owned module is no longer required).

- name: "preflight | OS family check"
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'RedHat'
      - ansible_facts.distribution == 'Fedora'
      - ansible_facts.distribution_major_version | int >= 44
    fail_msg: >
      topic_gnupg_pinentry_dbus targets Fedora 44 or later. Detected:
      {{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_major_version }}.

- name: "preflight | required packages present"
  ansible.builtin.command:
    argv:
      - rpm
      - "-q"
      - "{{ item }}"
  register: req_pkg_check
  changed_when: false
  failed_when: req_pkg_check.rc != 0
  loop: "{{ topic_gnupg_pinentry_dbus_required_packages }}"

- name: "preflight | operator runtime SELinux mapping"
  ansible.builtin.command:
    argv:
      - id
      - "-Z"
  register: id_z_result
  changed_when: false
  failed_when: false

- name: "preflight | applicability gate on operator mapping"
  ansible.builtin.fail:
    msg: |
      gnupg-pinentry-dbus: operator runtime SELinux mapping does not
      match the applicability anchor
      ('{{ topic_gnupg_pinentry_dbus_expected_seuser_substring }}').
      Detected: '{{ id_z_result.stdout | trim }}'.
      The two stock-policy gaps are reachable only from the staff_u →
      staff_r → staff_t user-mapping path; an unconfined_u operator does
      not exercise the gap and does not need this topic.
  when:
    - topic_gnupg_pinentry_dbus_expected_seuser_substring
        not in (id_z_result.stdout | default(''))

- name: "preflight | read operator pinentry-program selection"
  ansible.builtin.command:
    argv:
      - grep
      - "-E"
      - "^pinentry-program"
      - "{{ topic_gnupg_pinentry_dbus_user_gpg_agent_conf }}"
  register: pinentry_program_line
  changed_when: false
  failed_when: false

- name: "preflight | applicability gate on pinentry-program selection"
  ansible.builtin.fail:
    msg: |
      gnupg-pinentry-dbus: pinentry-program selection does not match
      the applicability anchor
      ('{{ topic_gnupg_pinentry_dbus_expected_pinentry_program }}').
      Detected: '{{ pinentry_program_line.stdout | default('(no pinentry-program line)') | trim }}'.
      The functional gap is reachable only via the GNOME helper that
      delegates to gcr-prompter over the per-user D-Bus session bus;
      operators on pinentry-curses / -tty / -qt / -gtk2 backends do not
      exercise the gap and do not need this topic.
  when:
    - topic_gnupg_pinentry_dbus_expected_pinentry_program
        not in (pinentry_program_line.stdout | default(''))

- name: "preflight | pre-load sesearch on functional surface"
  ansible.builtin.command:
    argv:
      - sesearch
      - "-A"
      - "-s"
      - "gpg_pinentry_t"
      - "-t"
      - "session_dbusd_tmp_t"
      - "-c"
      - "sock_file"
      - "-p"
      - "write"
  register: pre_rule_a
  changed_when: false
  failed_when: false
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"

- name: "preflight | pre-load sesearch on audit-cosmetic surface (noatsecure)"
  ansible.builtin.command:
    argv:
      - sesearch
      - "-A"
      - "-s"
      - "gpg_t"
      - "-t"
      - "gpg_agent_t"
      - "-c"
      - "process"
      - "-p"
      - "noatsecure"
  register: pre_rule_b_noatsecure
  changed_when: false
  failed_when: false
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"

- name: "preflight | pre-load sesearch on audit-cosmetic surface (rlimitinh)"
  ansible.builtin.command:
    argv:
      - sesearch
      - "-A"
      - "-s"
      - "gpg_t"
      - "-t"
      - "gpg_agent_t"
      - "-c"
      - "process"
      - "-p"
      - "rlimitinh"
  register: pre_rule_b_rlimitinh
  changed_when: false
  failed_when: false
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"

- name: "preflight | pre-load sesearch on audit-cosmetic surface (siginh)"
  ansible.builtin.command:
    argv:
      - sesearch
      - "-A"
      - "-s"
      - "gpg_t"
      - "-t"
      - "gpg_agent_t"
      - "-c"
      - "process"
      - "-p"
      - "siginh"
  register: pre_rule_b_siginh
  changed_when: false
  failed_when: false
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"

- name: "preflight | compute workaround-obsolescence flag"
  ansible.builtin.set_fact:
    topic_gnupg_pinentry_dbus_already_closed: >-
      {{ ((pre_rule_a.stdout | default('')) | length > 0)
         and ((pre_rule_b_noatsecure.stdout | default('')) | length > 0)
         and ((pre_rule_b_rlimitinh.stdout | default('')) | length > 0)
         and ((pre_rule_b_siginh.stdout | default('')) | length > 0) }}

- name: "preflight | report workaround-obsolescence disposition"
  ansible.builtin.debug:
    msg: |
      gnupg-pinentry-dbus: both allow surfaces are already present in
      the loaded policy. A future stock-policy update has shipped the
      equivalent grants; the topic-owned module is not required and
      the apply stage will skip the CIL push as a clean no-op.
  when:
    - topic_gnupg_pinentry_dbus_already_closed | bool

- name: "preflight | pre-hardening sanity baseline (non-fatal capture)"
  ansible.builtin.shell: |
    set +e
    rpm -q gnupg2 pinentry pinentry-gnome3 gcr3
    grep -E '^pinentry-program' "{{ topic_gnupg_pinentry_dbus_user_gpg_agent_conf }}" 2>&1 || true
    id -Z
    semodule -lfull | grep -wE '^[ ]*400.*gnupg_pinentry_dbus' || echo '(module not installed)'
    sesearch -A -s gpg_pinentry_t -t session_dbusd_tmp_t -c sock_file -p write 2>&1 || true
    sesearch -A -s gpg_t -t gpg_agent_t -c process 2>&1 || true
    ausearch -m AVC,USER_AVC -ts boot 2>/dev/null \
      | grep -E '(gpg_pinentry_t|gpg_t.*gpg_agent_t.*process)' \
      | head -20 \
      || true
    exit 0
  args:
    executable: /bin/bash
  register: preflight_sanity_recon
  changed_when: false
  failed_when: false
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"

- name: "preflight | report pre-hardening sanity baseline"
  ansible.builtin.debug:
    msg: >
      Pre-deploy gnupg-pinentry-dbus state snapshot (non-fatal capture):
      {{ preflight_sanity_recon.stdout | trim }}.
