---
# Tunables for topic_integrity_monitoring. Override in group_vars or playbook.

# Unit-file directory for the operator-supplied units.
topic_im_unit_dir: "/etc/systemd/system"

# Wrapper install path. Note the SELinux consequence: this directory carries
# bin_t, so PID 1 starts the wrapper as unconfined_service_t. That is why the
# AIDE check runs through a nested unit rather than directly.
topic_im_wrapper_dir: "/usr/local/sbin"

# Priority-400 CIL publish directory.
topic_im_cil_dir: "/usr/local/share/selinux"

# Shell-profile drop-in directory for the optional banner.
topic_im_profile_d_dir: "/etc/profile.d"

# Acceptance-list directory.
topic_im_accept_dir: "/etc/integrity-check"

# Required packages: the integrity tool, and the package manager itself for
# the verification pass and the unowned sweep.
topic_im_required_packages:
  - aide
  - rpm

# Topic-owned CIL module and load priority. The single rule permits the AIDE
# domain to stat a filesystem that carries no SELinux labels, which is needed
# because the boot partition stays in scope.
topic_im_cil_module_name: "aide_extras"
topic_im_cil_priority: 400

# Optional shell banner. Set to false to skip the file write.
topic_im_install_alert_banner: true

# AIDE paths and expected labels.
topic_im_aide_conf: "/etc/aide.conf"
topic_im_aide_db: "/var/lib/aide/aide.db.gz"
topic_im_aide_db_dir: "/var/lib/aide"
topic_im_log_dir: "/var/log/aide"
topic_im_expected_db_seltype: "aide_db_t"
topic_im_expected_unit_seltype: "systemd_unit_file_t"
topic_im_expected_banner_seltype: "bin_t"
topic_im_expected_wrapper_seltype: "bin_t"

# Trees removed from the AIDE scope because the package database already
# carries a self-maintaining baseline for them. Computed on the target at
# apply time -- this list names the RULE PREFIXES to comment out, never the
# resulting path set. A shipped path set would be host-specific and wrong
# everywhere else.
topic_im_inverted_trees:
  - "/bin"
  - "/sbin"
  - "/lib"
  - "/lib64"
  - "/opt"
  - "/usr"

# Added back explicitly: sits under the removed /usr tree but is by definition
# not package-managed, which makes it exactly the case a hash baseline is for.
topic_im_readded_trees:
  - "/usr/local"

# Roots the unowned sweep and the context dry-run walk.
topic_im_scan_roots:
  - "/usr"
  - "/opt"
  - "/boot"
  - "/etc"

# Log retention, in days, over the per-run file set.
topic_im_log_retention_days: 90
