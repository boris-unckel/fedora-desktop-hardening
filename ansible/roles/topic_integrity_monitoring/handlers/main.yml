---
# Handlers for topic_integrity_monitoring.
#
# Notification channels:
#   "topic_im cil changed"      -- CIL source changed; install via semodule.
#   "topic_im unit changed"     -- any unit file changed; relabel, reload,
#                                  restart the timer.
#   "topic_im wrapper changed"  -- wrapper changed; relabel it.
#   "topic_im banner changed"   -- banner changed; relabel it.
#
# Relabelling is not cosmetic: a unit file without systemd_unit_file_t is not
# loaded at all, and the failure presents as a missing unit rather than as a
# permission error.

- name: "topic_im | semodule install {{ topic_im_cil_module_name }}"
  ansible.builtin.command:
    argv:
      - semodule
      - "-X"
      - "{{ topic_im_cil_priority | string }}"
      - "-i"
      - "{{ topic_im_cil_dir }}/{{ topic_im_cil_module_name }}.cil"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_im cil changed"

- name: "topic_im | restorecon units"
  ansible.builtin.command:
    argv:
      - restorecon
      - "-Fv"
      - "{{ topic_im_unit_dir }}/integrity-check.service"
      - "{{ topic_im_unit_dir }}/integrity-check.timer"
      - "{{ topic_im_unit_dir }}/aide-check.service"
      - "{{ topic_im_unit_dir }}/aide-init.service"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_im unit changed"

- name: "topic_im | restorecon wrapper"
  ansible.builtin.command:
    argv:
      - restorecon
      - "-Fv"
      - "{{ topic_im_wrapper_dir }}/integrity-check"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_im wrapper changed"

- name: "topic_im | restorecon acceptance directory"
  # The directory is created by this role and no later step revisits it, so
  # without this handler it keeps the context it inherited from /etc at
  # creation time. -R also covers the seed file and any acceptance list the
  # wrapper has written since; -F resets the SELinux user field, which the
  # type-only comparison of `restorecon -n` would never report -- including
  # the comparison this very topic runs as its fourth check.
  ansible.builtin.command:
    argv:
      - restorecon
      - "-Fv"
      - "-R"
      - "{{ topic_im_accept_dir }}"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_im accept dir changed"

- name: "topic_im | restorecon banner"
  ansible.builtin.command:
    argv:
      - restorecon
      - "-Fv"
      - "{{ topic_im_profile_d_dir }}/aide-alert.sh"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_im banner changed"

- name: "topic_im | daemon-reload"
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  listen: "topic_im unit changed"

- name: "topic_im | restart integrity-check.timer"
  ansible.builtin.systemd:
    name: "integrity-check.timer"
    state: restarted
  become: true
  listen: "topic_im unit changed"
