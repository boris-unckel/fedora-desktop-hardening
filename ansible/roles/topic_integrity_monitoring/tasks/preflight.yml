---
# Preflight for topic_integrity_monitoring. Blocks the apply when the host
# family is wrong, when a required package is missing, or when a target path
# does not resolve to the SELinux type the design depends on. The scope-ratio
# recon and the SELinux transition report are non-fatal.

- name: "preflight | OS family check"
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'RedHat'
      - ansible_facts.distribution == 'Fedora'
      - ansible_facts.distribution_major_version | int >= 44
    fail_msg: >
      topic_integrity_monitoring targets Fedora 44 or later. Detected:
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }}.

- name: "preflight | required packages present"
  ansible.builtin.command:
    argv:
      - rpm
      - "-q"
      - "{{ item }}"
  register: req_pkg_check
  changed_when: false
  failed_when: req_pkg_check.rc != 0
  loop: "{{ topic_im_required_packages }}"

- name: "preflight | AIDE configuration present"
  ansible.builtin.stat:
    path: "{{ topic_im_aide_conf }}"
  register: aide_conf_stat
  become: true

- name: "preflight | fail-fast without an AIDE configuration"
  ansible.builtin.fail:
    msg: >
      {{ topic_im_aide_conf }} is missing. The role inverts an existing stock
      configuration rather than writing one from scratch, so there is nothing
      to invert. Install the aide package properly before applying.
  when: not aide_conf_stat.stat.exists

# --- SELinux label expectations the design depends on ------------------------

- name: "preflight | matchpathcon unit path"
  ansible.builtin.command:
    argv:
      - matchpathcon
      - "{{ topic_im_unit_dir }}/integrity-check.service"
  register: mpc_unit
  changed_when: false
  failed_when: false

- name: "preflight | fail-fast when the unit path does not resolve to {{ topic_im_expected_unit_seltype }}"
  ansible.builtin.fail:
    msg: |
      matchpathcon {{ topic_im_unit_dir }}/integrity-check.service returned:
        {{ mpc_unit.stdout | trim }}
      Expected: {{ topic_im_expected_unit_seltype }}.
      A unit file without that label is not loaded at all, and the failure
      presents as a missing unit rather than as a permission error.
  when: (mpc_unit.stdout | regex_search(topic_im_expected_unit_seltype)) is none

- name: "preflight | matchpathcon wrapper path"
  ansible.builtin.command:
    argv:
      - matchpathcon
      - "{{ topic_im_wrapper_dir }}/integrity-check"
  register: mpc_wrapper
  changed_when: false
  failed_when: false

- name: "preflight | report the wrapper domain consequence"
  ansible.builtin.debug:
    msg: >
      matchpathcon {{ topic_im_wrapper_dir }}/integrity-check ->
      {{ mpc_wrapper.stdout | trim }}. With {{ topic_im_expected_wrapper_seltype }}
      the wrapper runs as unconfined_service_t, from which no type-transition
      to a confined tool domain exists. This is why the AIDE check runs through
      a nested unit rather than directly -- see the topic Reference.

- name: "preflight | matchpathcon banner path"
  ansible.builtin.command:
    argv:
      - matchpathcon
      - "{{ topic_im_profile_d_dir }}/aide-alert.sh"
  register: mpc_banner
  changed_when: false
  failed_when: false
  when: topic_im_install_alert_banner | bool

- name: "preflight | fail-fast when the banner path does not resolve to {{ topic_im_expected_banner_seltype }}"
  ansible.builtin.fail:
    msg: |
      matchpathcon {{ topic_im_profile_d_dir }}/aide-alert.sh returned:
        {{ mpc_banner.stdout | default('') | trim }}
      Expected: {{ topic_im_expected_banner_seltype }}.
  when:
    - topic_im_install_alert_banner | bool
    - (mpc_banner.stdout | default('') | regex_search(topic_im_expected_banner_seltype)) is none

- name: "preflight | stock transition init_t -> aide_t must exist"
  ansible.builtin.command:
    argv:
      - sesearch
      - "-T"
      - "-s"
      - "init_t"
      - "-t"
      - "aide_exec_t"
      - "-c"
      - "process"
  register: pretest_aide_transition
  changed_when: false
  failed_when: false
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"

- name: "preflight | fail-fast without the stock transition"
  ansible.builtin.fail:
    msg: |
      No stock type-transition init_t -> aide_t on aide_exec_t found.
      The nested-unit design exists precisely to obtain that transition; without
      it in policy, the AIDE check would run unconfined and the design premise
      does not hold on this host.
  when: (pretest_aide_transition.stdout | trim) == ''

# --- Non-fatal recon: is the inversion worth it on THIS host? ----------------
#
# The whole topic rests on the package-owned share being overwhelming. Measure
# it here rather than assuming it, so an operator on an unusual host sees the
# real number before applying.
#
# No early-exit consumer on a still-writing producer anywhere in this pipeline:
# `grep -c` and `wc -l` read to end of input. An early-exit consumer such as
# `grep -q` or `head` would take SIGPIPE under `set -o pipefail` and fail the
# task for a reason that has nothing to do with the host.

- name: "preflight | package-owned share recon"
  ansible.builtin.shell: |
    set -uo pipefail
    export LC_ALL=C
    norm() { sed -E -e 's#^/(bin|sbin|lib|lib64)/#/usr/\1/#' -e 's#^/usr/sbin/#/usr/bin/#'; }
    rpm -qal 2>/dev/null | norm | sort -u >/tmp/.im_owned.$$
    find {{ topic_im_scan_roots | join(' ') }} -xdev \( -type f -o -type l \) 2>/dev/null \
      | norm | sort -u >/tmp/.im_fs.$$
    total=$(wc -l </tmp/.im_fs.$$)
    owned=$(comm -12 /tmp/.im_fs.$$ /tmp/.im_owned.$$ | wc -l)
    unowned=$(comm -23 /tmp/.im_fs.$$ /tmp/.im_owned.$$ | wc -l)
    rm -f /tmp/.im_owned.$$ /tmp/.im_fs.$$
    printf 'paths=%s owned=%s unowned=%s\n' "$total" "$owned" "$unowned"
    exit 0
  args:
    executable: /bin/bash
  register: share_recon
  changed_when: false
  failed_when: false
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"

- name: "preflight | report package-owned share"
  ansible.builtin.debug:
    msg: >
      Scope recon ({{ share_recon.stdout | trim }}). The inversion moves the
      package-owned share to the package verification pass and leaves the
      unowned remainder to the hash baseline. A host where the unowned count is
      not small relative to the total is unusual and worth understanding before
      applying.

- name: "preflight | current AIDE database size"
  ansible.builtin.stat:
    path: "{{ topic_im_aide_db }}"
  register: db_pre_stat
  become: true

- name: "preflight | report current baseline size"
  ansible.builtin.debug:
    msg: >
      {{ topic_im_aide_db }}
      {{ 'is ' + (db_pre_stat.stat.size | string) + ' bytes before inversion'
         if db_pre_stat.stat.exists else
         'does not exist; the apply will take the first baseline' }}.
