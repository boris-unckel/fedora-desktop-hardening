---
# Role: topic_mozilla_thunderbird
# Pattern: Preflight -> optional profile-snapshot -> RPM-removal -> system-install
# -> sandbox-override -> portal-permission hard-deny -> portal-cache reset
# -> optional profile-seeding -> MIME-defaults verify
# Idempotent: yes (re-applying must not change state on a correctly applied
# host; every modify task wraps a Flatpak/DNF call in `creates:` or
# `changed_when:` discipline)
#
# No drop-in push, no CIL-module install, no daemon-reload, no restorecon,
# no semanage fcontext, no system-bus systemctl restart, no kernel-module
# load, no setsebool, and no per-profile preference seed (the application
# has no VAAPI-equivalent operator-side surface in this topic's framing).
# The only service restart is the per-user xdg-document-portal.service reset
# reflex (encoded as a regular task, NOT as a handler).

- name: "topic_mozilla_thunderbird | preflight"
  ansible.builtin.import_tasks: preflight.yml
  tags:
    - topic_mozilla_thunderbird
    - preflight

- name: "topic_mozilla_thunderbird | probe (read-only)"
  ansible.builtin.script: "files/probe.sh"
  changed_when: false
  failed_when: false
  register: probe_result
  tags:
    - topic_mozilla_thunderbird
    - probe

- name: "topic_mozilla_thunderbird | apply configuration"
  block:

    - name: "topic_mozilla_thunderbird | initialize change-aggregate fact"
      ansible.builtin.set_fact:
        __topic_mozilla_thunderbird_overrides_changed: false

    - name: "topic_mozilla_thunderbird | optional host-side profile snapshot"
      ansible.builtin.shell: >
        tar --zstd --acls --xattrs -cpf
            "{{ topic_mozilla_thunderbird_external_snapshot_path }}"
            -C "/home/{{ ansible_user_id }}/.thunderbird/"
            profiles.ini installs.ini
            {% for p in topic_mozilla_thunderbird_profiles %}
            {{ p | quote }}
            {% endfor %}
      args:
        creates: "{{ topic_mozilla_thunderbird_external_snapshot_path }}"
      when:
        - (topic_mozilla_thunderbird_external_snapshot_path | default('')) != ''
        - (topic_mozilla_thunderbird_profiles | length) > 0

    - name: "topic_mozilla_thunderbird | RPM-removal of Thunderbird tree"
      ansible.builtin.dnf:
        name: "{{ topic_mozilla_thunderbird_rpm_removal_set }}"
        state: absent
      become: true

    - name: "topic_mozilla_thunderbird | dnf autoremove of trailing orphans"
      ansible.builtin.dnf:
        autoremove: true
      become: true

    - name: "topic_mozilla_thunderbird | system-install of application ref"
      ansible.builtin.command:
        argv:
          - flatpak
          - install
          - "-y"
          - "--system"
          - "{{ topic_mozilla_thunderbird_fedora_remote_name }}"
          - "{{ topic_mozilla_thunderbird_application_id }}"
      args:
        creates: >-
          /var/lib/flatpak/app/{{ topic_mozilla_thunderbird_application_id }}
      become: true
      become_flags: "-r sysadm_r -t sysadm_t"

    - name: "topic_mozilla_thunderbird | sandbox-override write"
      ansible.builtin.shell: >
        before=$(cat
                 "/var/lib/flatpak/overrides/{{ topic_mozilla_thunderbird_application_id }}"
                 2>/dev/null || true) ;
        flatpak override --system "{{ topic_mozilla_thunderbird_application_id }}"
          {% for fs in topic_mozilla_thunderbird_sandbox_override.filesystems_deny %}
          --nofilesystem={{ fs | quote }}
          {% endfor %}
          {% for fs in topic_mozilla_thunderbird_sandbox_override.filesystems_allow %}
          --filesystem={{ fs | quote }}
          {% endfor %}
          {% for s in topic_mozilla_thunderbird_sandbox_override.sockets_deny %}
          --nosocket={{ s | quote }}
          {% endfor %}
          {% for s in topic_mozilla_thunderbird_sandbox_override.sockets_allow %}
          --socket={{ s | quote }}
          {% endfor %}
        ;
        rc=$? ;
        after=$(cat
                "/var/lib/flatpak/overrides/{{ topic_mozilla_thunderbird_application_id }}"
                2>/dev/null || true) ;
        if [ "$before" = "$after" ]; then
          echo "UNCHANGED" ;
        else
          echo "CHANGED" ;
        fi ;
        exit "$rc"
      register: override_result
      changed_when: "'CHANGED' in override_result.stdout"
      failed_when: override_result.rc != 0
      become: true
      become_flags: "-r sysadm_r -t sysadm_t"

    - name: "topic_mozilla_thunderbird | aggregate override-change signal"
      ansible.builtin.set_fact:
        __topic_mozilla_thunderbird_overrides_changed: true
      when:
        - override_result is defined
        - "'CHANGED' in (override_result.stdout | default(''))"

    - name: "topic_mozilla_thunderbird | portal-permission hard-deny set"
      ansible.builtin.shell: >
        before=$(flatpak permission-list org.freedesktop.impl.portal.access
                  2>/dev/null
                  | grep -E "^org\\.freedesktop\\.impl\\.portal\\.access[[:space:]]+{{ item.surface }}[[:space:]]+{{ topic_mozilla_thunderbird_application_id }}[[:space:]]"
                  || true) ;
        flatpak permission-set org.freedesktop.impl.portal.access
          {{ item.surface | quote }}
          {{ topic_mozilla_thunderbird_application_id | quote }}
          {{ item.value | quote }} ;
        rc=$? ;
        after=$(flatpak permission-list org.freedesktop.impl.portal.access
                 2>/dev/null
                 | grep -E "^org\\.freedesktop\\.impl\\.portal\\.access[[:space:]]+{{ item.surface }}[[:space:]]+{{ topic_mozilla_thunderbird_application_id }}[[:space:]]"
                 || true) ;
        if [ "$before" = "$after" ]; then
          echo "UNCHANGED" ;
        else
          echo "CHANGED" ;
        fi ;
        exit "$rc"
      register: portal_set_result
      changed_when: "'CHANGED' in portal_set_result.stdout"
      failed_when: portal_set_result.rc != 0
      become: true
      become_flags: "-r sysadm_r -t sysadm_t"
      loop:
        - { surface: "camera",
            value: "{{ topic_mozilla_thunderbird_portal_permission_camera }}" }
        - { surface: "microphone",
            value: "{{ topic_mozilla_thunderbird_portal_permission_microphone }}" }
        - { surface: "location",
            value: "{{ topic_mozilla_thunderbird_portal_permission_location }}" }
      loop_control:
        label: "{{ item.surface }}={{ item.value }}"

    - name: "topic_mozilla_thunderbird | aggregate portal-permission change signal"
      ansible.builtin.set_fact:
        __topic_mozilla_thunderbird_overrides_changed: true
      when:
        - portal_set_result is defined
        - portal_set_result.results is defined
        - portal_set_result.results
            | selectattr('stdout', 'search', 'CHANGED')
            | list | length > 0

    - name: "topic_mozilla_thunderbird | conditional portal-cache reset"
      ansible.builtin.systemd_service:
        name: xdg-document-portal.service
        scope: user
        state: restarted
      become: false
      when:
        - __topic_mozilla_thunderbird_overrides_changed | bool

    - name: "topic_mozilla_thunderbird | optional profile-seeding"
      ansible.builtin.shell: >
        tar --zstd --acls --xattrs -xpf
            "{{ topic_mozilla_thunderbird_external_snapshot_path }}"
            -C "/home/{{ ansible_user_id }}/.var/app/{{ topic_mozilla_thunderbird_application_id }}/.thunderbird/"
      register: profile_seeding
      changed_when: profile_seeding.rc == 0
      failed_when: profile_seeding.rc != 0
      when:
        - (topic_mozilla_thunderbird_external_snapshot_path | default('')) != ''
        - (topic_mozilla_thunderbird_profiles | length) > 0

    - name: "topic_mozilla_thunderbird | MIME default-mailto informational read"
      ansible.builtin.command:
        argv:
          - xdg-mime
          - query
          - default
          - x-scheme-handler/mailto
      register: default_mailto_check
      changed_when: false
      failed_when: false
      become: false

    - name: "topic_mozilla_thunderbird | MIME-default mapping note"
      ansible.builtin.debug:
        msg: |
          topic_mozilla_thunderbird: xdg-mime reports default mailto handler
          as '{{ default_mailto_check.stdout | trim }}'. On a host whose
          pre-deploy mailto mapping resolved to a different desktop entry,
          run
            xdg-mime default {{ topic_mozilla_thunderbird_application_id }}.desktop \
                              x-scheme-handler/mailto
          as the closing operator-side intervention. The role does not
          write any xdg-mime default invocation.
      when:
        - (default_mailto_check.stdout | default('') | trim)
            != topic_mozilla_thunderbird_application_id ~ '.desktop'

  rescue:

    - name: "topic_mozilla_thunderbird | apply failed; do not auto-rollback"
      ansible.builtin.fail:
        msg: |
          topic_mozilla_thunderbird modify step failed. Auto-rollback is not
          defined for this topic. The byte-exact rollback verb (the
          four-call sequence `flatpak permission-reset`,
          `flatpak override --system --reset`, `flatpak uninstall -y --system`,
          `dnf install -y` of the four-package set, plus operator-side
          restoration of the host-side profile tree from the operator's
          external snapshot if applicable) is documented in the Topic
          Reference under Recovery posture and is the operator's deliberate
          decision. Boot-failure risk for this topic is structurally zero
          (the application is post-login and has no init_t dependency).

  tags:
    - topic_mozilla_thunderbird
    - apply

- name: "topic_mozilla_thunderbird | verify (Soll/Ist)"
  ansible.builtin.script: "files/verify.sh"
  changed_when: false
  register: verify_result
  failed_when: verify_result.rc != 0
  tags:
    - topic_mozilla_thunderbird
    - verify
