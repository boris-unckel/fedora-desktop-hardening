---
# Handlers for topic_network_manager.
#
# Two notification channels:
#   "topic_network_manager cil changed"    — fires on a change to the CIL
#                                             source file. Triggers semodule
#                                             install under sysadm_r.
#   "topic_network_manager dropin changed" — fires on a change to either
#                                             drop-in file. Triggers
#                                             restorecon, daemon-reload,
#                                             and a unit restart in order.

- name: "topic_network_manager | semodule install nnp_network_manager"
  ansible.builtin.command:
    argv:
      - semodule
      - "-X"
      - "{{ topic_network_manager_cil_priority | string }}"
      - "-i"
      - "{{ topic_network_manager_cil_dir }}/{{ topic_network_manager_cil_module_name }}.cil"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_network_manager cil changed"

- name: "topic_network_manager | restorecon NetworkManager drop-ins"
  ansible.builtin.command:
    argv:
      - restorecon
      - "-v"
      - "{{ topic_network_manager_dropin_dir }}/99-hardening.conf"
      - "{{ topic_network_manager_dropin_dir }}/99-nnp.conf"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_network_manager dropin changed"

- name: "topic_network_manager | daemon-reload"
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "topic_network_manager dropin changed"

- name: "topic_network_manager | restart NetworkManager"
  ansible.builtin.systemd:
    name: "NetworkManager.service"
    state: restarted
  listen: "topic_network_manager dropin changed"
