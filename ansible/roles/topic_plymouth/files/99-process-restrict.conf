[Service]
MemoryDenyWriteExecute=yes
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources @debug @mount @cpu-emulation @obsolete @raw-io @reboot @swap @module @clock
# plymouthd calls klogctl (the syslog(2) syscall) on every splash show, via
# ply_show_new_kernel_messages, to render kernel boot messages. syslog is not in
# @system-service and not in any subtracted class above, so the default-deny
# allowlist SIGSYS-kills plymouthd at boot without this positive re-add. It is
# additive only — no precedence conflict with the ~ line. ProtectKernelLogs=yes
# in 99-hardening.conf still gates the actual ring-buffer read down to EPERM,
# which plymouth tolerates; this line only prevents the seccomp kill.
SystemCallFilter=syslog
CapabilityBoundingSet=CAP_SYS_ADMIN CAP_SYS_TTY_CONFIG CAP_CHOWN
