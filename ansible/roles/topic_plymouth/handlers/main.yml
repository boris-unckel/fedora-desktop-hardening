---
# Handlers for topic_plymouth.
#
# Two notification channels:
#   "topic_plymouth cil changed"    — fires on a change to the CIL source
#                                      file. Triggers semodule install
#                                      under sysadm_r.
#   "topic_plymouth dropin changed" — fires on a change to any of the
#                                      three drop-in files. Triggers
#                                      restorecon and daemon-reload.
#
# There is no `restart plymouth-start` handler: plymouth-start runs once
# during the early-boot sequence and the splash hand-off has already
# completed by the time the role finishes deploying. The apply path is
# the next reboot.

- name: "topic_plymouth | semodule install nnp_plymouth"
  ansible.builtin.command:
    argv:
      - semodule
      - "-X"
      - "{{ topic_plymouth_cil_priority | string }}"
      - "-i"
      - "{{ topic_plymouth_cil_dir }}/{{ topic_plymouth_cil_module_name }}.cil"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_plymouth cil changed"

- name: "topic_plymouth | restorecon plymouth-start drop-ins"
  # -R so the drop-in directory itself is relabelled, not only the files
  # inside it. The directory is created by this role and takes its context
  # from the parent directory at creation time; no later step revisits it.
  # -F additionally resets the SELinux user field. Without it every path
  # keeps the user identity of whoever applied the role, and that drift is
  # invisible to `restorecon -n`, which compares the type alone.
  ansible.builtin.command:
    argv:
      - restorecon
      - "-F"
      - "-v"
      - "-R"
      - "{{ topic_plymouth_dropin_dir }}"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_plymouth dropin changed"

- name: "topic_plymouth | daemon-reload"
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "topic_plymouth dropin changed"
