---
# Role: topic_plymouth
# Pattern: Probe -> Modify -> Verify
# Idempotent: yes (re-applying does not change state on a correctly
# configured host; see README.md "Idempotence notes").
#
# Modify ordering invariant:
#   1. Push CIL source to /usr/local/share/selinux/.
#   2. Install CIL module via semodule -X 400 -i (handler).
#   3. flush_handlers — the CIL must be loaded before the NNP drop-in.
#   4. Push the three drop-in INI files.
#   5. restorecon on the drop-in files (handler).
#   6. Daemon-reload (handler).
# A change to any of the four shipping artefacts notifies the
# appropriate handler chain. There is no `restart plymouth-start.service`
# task; plymouth-start runs once during the early-boot sequence and the
# splash hand-off has already completed by the time the role finishes
# deploying. The apply path is the next reboot. Live-state probe is
# read-only.

- name: "topic_plymouth | preflight"
  ansible.builtin.import_tasks: preflight.yml
  tags:
    - topic_plymouth
    - preflight

- name: "topic_plymouth | probe (read-only)"
  ansible.builtin.script: "files/probe.sh"
  changed_when: false
  failed_when: false
  register: probe_result
  tags:
    - topic_plymouth
    - probe

- name: "topic_plymouth | apply configuration"
  block:

    - name: "topic_plymouth | CIL publish directory present"
      ansible.builtin.file:
        path: "{{ topic_plymouth_cil_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: "topic_plymouth | install CIL source"
      ansible.builtin.copy:
        src: "{{ topic_plymouth_cil_module_name }}.cil"
        dest: "{{ topic_plymouth_cil_dir }}/{{ topic_plymouth_cil_module_name }}.cil"
        owner: root
        group: root
        mode: "0644"
      become: true
      notify:
        - "topic_plymouth cil changed"

    - name: "topic_plymouth | flush handlers (CIL must be loaded before NNP drop-in)"
      ansible.builtin.meta: flush_handlers

    - name: "topic_plymouth | drop-in directory present"
      ansible.builtin.file:
        path: "{{ topic_plymouth_dropin_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: "topic_plymouth | install 99-hardening.conf"
      ansible.builtin.copy:
        src: "99-hardening.conf"
        dest: "{{ topic_plymouth_dropin_dir }}/99-hardening.conf"
        owner: root
        group: root
        mode: "0644"
      become: true
      notify:
        - "topic_plymouth dropin changed"

    - name: "topic_plymouth | install 99-nnp.conf"
      ansible.builtin.copy:
        src: "99-nnp.conf"
        dest: "{{ topic_plymouth_dropin_dir }}/99-nnp.conf"
        owner: root
        group: root
        mode: "0644"
      become: true
      notify:
        - "topic_plymouth dropin changed"

    - name: "topic_plymouth | install 99-process-restrict.conf"
      ansible.builtin.copy:
        src: "99-process-restrict.conf"
        dest: "{{ topic_plymouth_dropin_dir }}/99-process-restrict.conf"
        owner: root
        group: root
        mode: "0644"
      become: true
      notify:
        - "topic_plymouth dropin changed"

    - name: "topic_plymouth | read post-deploy plymouth-start state"
      ansible.builtin.shell: >
        systemctl show plymouth-start.service -p ActiveState,SubState,Result --value || true
      args:
        executable: /bin/bash
      register: post_deploy_plymouth_state
      changed_when: false
      failed_when: false

    - name: "topic_plymouth | read post-deploy plymouth-quit-wait state"
      ansible.builtin.shell: >
        systemctl show plymouth-quit-wait.service -p ActiveState,SubState,Result --value || true
      args:
        executable: /bin/bash
      register: post_deploy_quitwait_state
      changed_when: false
      failed_when: false

    - name: "topic_plymouth | read AVC count since boot"
      ansible.builtin.shell: >
        ausearch -m AVC -ts boot
        | grep -cE '(plymouthd_t|plymouthd_exec_t|nnp_transition|plymouth)'
        || true
      args:
        executable: /bin/bash
      register: avc_count
      changed_when: false
      failed_when: false
      become: true
      become_flags: "-r sysadm_r -t sysadm_t"

    - name: "topic_plymouth | report live state"
      ansible.builtin.debug:
        msg: >
          plymouth-start state={{ post_deploy_plymouth_state.stdout | trim | replace('\n', '/') }};
          plymouth-quit-wait state={{ post_deploy_quitwait_state.stdout | trim | replace('\n', '/') }};
          AVC count since boot={{ (avc_count.stdout | default('0')) | trim }}.
          The deploy lands in the live unit-state on the next reboot only;
          plymouth-start is at-boot-only and is not restarted by this role.

  rescue:

    - name: "topic_plymouth | apply failed; do not auto-rollback"
      ansible.builtin.fail:
        msg: |
          topic_plymouth apply step failed. Auto-rollback is intentionally
          not performed; rolling back the four artefacts requires an
          operator decision about which stage to revert (NNP drop-in plus
          CIL unload only, or the NNP-and-process-internal-restriction
          surface, or the entire topic-owned hardening surface). See the
          topic Reference under "Verification" for the three-stage
          rollback sequence and the recover-from-boot-failure how-to for
          the boot-failure variant.

  tags:
    - topic_plymouth
    - apply

- name: "topic_plymouth | flush handlers before verify"
  ansible.builtin.meta: flush_handlers
  tags:
    - topic_plymouth
    - apply

- name: "topic_plymouth | verify (Soll/Ist)"
  ansible.builtin.script: "files/verify.sh"
  changed_when: false
  register: verify_result
  failed_when: verify_result.rc != 0
  tags:
    - topic_plymouth
    - verify
