---
# Tunables for topic_python_pip_user_tree. Override in group_vars or playbook.

# Marker filename. The path's directory part is resolved dynamically at deploy
# time from `python3 -c 'import sysconfig; print(sysconfig.get_path("stdlib"))'`
# rather than hard-coded. Hard-coding /usr/lib/python3.X/ or /usr/lib64/python3.X/
# is the documented bug class.
topic_python_pip_user_tree_marker_filename: "EXTERNALLY-MANAGED"

# Expected file mode and ownership of the marker.
topic_python_pip_user_tree_expected_marker_mode: "644"
topic_python_pip_user_tree_expected_marker_owner: "root"
topic_python_pip_user_tree_expected_marker_group: "root"

# Expected first line of the marker body.
topic_python_pip_user_tree_marker_body_first_line: "[externally-managed]"

# Toggle the role's orphan-tree report. Setting either to false suppresses the
# corresponding probe and pause: surface; the role still does not auto-remove.
topic_python_pip_user_tree_check_orphan_user_trees: true
topic_python_pip_user_tree_check_userlocal_pip_layer: true

# Operator home directory used by the user-tree probe. Override per-host.
topic_python_pip_user_tree_user_home: "/home/<user>"

# Required tooling on the target host.
topic_python_pip_user_tree_required_packages:
  - python3
  - python3-pip
