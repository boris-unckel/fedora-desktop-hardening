---
# Tunables for topic_rngd. Override in group_vars or playbook.

# Drop-in directory for rngd.service.
topic_rngd_dropin_dir: "/etc/systemd/system/rngd.service.d"

# Priority-400 CIL publish directory.
topic_rngd_cil_dir: "/usr/local/share/selinux"

# Required package: the daemon, the unit file, the SELinux service-
# specific subtype set, and the default /etc/sysconfig/rngd.
topic_rngd_required_packages:
  - rng-tools

# Topic-owned CIL module name and load priority.
topic_rngd_cil_module_name: "nnp_rngd"
topic_rngd_cil_priority: 400

# Expected daemon-binary fcontext mapping. Stock targeted policy on
# Fedora 44 or later resolves /usr/bin/rngd to rngd_exec_t; a bin_t
# return is preflight fail-fast (manifest revision required).
topic_rngd_binary_path: "/usr/bin/rngd"
topic_rngd_expected_fcontext: "rngd_exec_t"

# Expected SELinux live domain.
topic_rngd_expected_selinux_domain: "rngd_t"

# Expected daemon-steady-state UID/GID after the internal privilege drop
# under -D daemon:daemon. Initial daemon UID is 0; live UID 0 at verify
# time is drift for the privilege-drop end-state.
topic_rngd_expected_uid: 2
topic_rngd_expected_gid: 2

# Expected effective values surfaced from `systemctl show --value`.
topic_rngd_expected_nnp: "yes"
topic_rngd_expected_mdwe: "yes"
topic_rngd_expected_protect_system: "full"
topic_rngd_expected_syscall_architectures: "native"

# CapabilityBoundingSet expected as a lowercase, alphabetically sorted
# whitespace-separated list. The verify script normalises the observed
# value before comparison.
topic_rngd_expected_caps_sorted:
  - cap_setgid
  - cap_setuid
  - cap_sys_admin

# RestrictAddressFamilies expected in source order (matches the drop-in
# source order; the property is order-preserving on output).
topic_rngd_expected_raf_source_order:
  - AF_UNIX
  - AF_NETLINK

# SystemCallFilter length-plus-anchor check parameters. The resolved
# filter is multi-thousand-byte; 1500 is a conservative lower bound.
topic_rngd_expected_scf_length_min: 1500
topic_rngd_expected_scf_anchor_tokens:
  - setgroups
  - setuid
  - capset
  - epoll_wait
  - recvfrom

# Entropy-source initialization tokens. The verify smoketest asserts
# >= 1 source initialized; the per-source set is platform-dependent.
topic_rngd_expected_init_source_tokens:
  - hwrng
  - rdrand
  - jitter

# /proc path for the kernel entropy-pool snapshot.
topic_rngd_entropy_avail_path: "/proc/sys/kernel/random/entropy_avail"
