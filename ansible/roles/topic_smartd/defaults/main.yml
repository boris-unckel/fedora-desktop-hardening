---
# Tunables for topic_smartd. Override in group_vars or playbook.

# Drop-in directory for smartd.service.
topic_smartd_dropin_dir: "/etc/systemd/system/smartd.service.d"

# Priority-400 CIL publish directory.
topic_smartd_cil_dir: "/usr/local/share/selinux"

# Required package: the daemon and its command-line client.
topic_smartd_required_packages:
  - smartmontools

# Expected effective values surfaced from `systemctl show --value`.
# CapabilityBoundingSet is alphabetical, lower-case, single-space-separated.
# RestrictAddressFamilies is a single value, no source-order question.
topic_smartd_expected_caps: "cap_sys_admin cap_sys_rawio"
topic_smartd_expected_address_families: "AF_UNIX"
topic_smartd_expected_selinux_domain: "fsdaemon_t"

# Topic-owned CIL module name and load priority.
topic_smartd_cil_module_name: "nnp_smartd"
topic_smartd_cil_priority: 400

# Executable label. The init_t -> fsdaemon_t type transition fires on the
# label of the binary, not on the unit file, so this topic owns that property:
# it asserts the label and restores it, instead of assuming the distribution
# policy carries the mapping for the path the binary actually occupies.
topic_smartd_binary_path: "/usr/bin/smartd"
topic_smartd_expected_exec_type: "fsdaemon_exec_t"

# The compatibility symlink keeps the generic type. Entries qualified with
# `--` in file_contexts match regular files only, so no rule applies to the
# link, and its type is not a defect.
topic_smartd_binary_symlink: "/usr/sbin/smartd"
topic_smartd_symlink_expected_type: "bin_t"

# Restrict the local mapping to regular files, mirroring the `--` qualifier of
# the distribution entry. An unqualified mapping also matches the compatibility
# symlink and turns it into a permanent context-drift report that nothing ever
# resolves.
topic_smartd_fcontext_ftype: "f"
