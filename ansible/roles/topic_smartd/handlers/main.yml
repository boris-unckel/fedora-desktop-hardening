---
# Handlers for topic_smartd.
#
# Two notification channels:
#   "topic_smartd cil changed"  — fires on a change to the CIL source file.
#                                  Triggers semodule install under sysadm_r.
#   "topic_smartd dropin changed" — fires on a change to any of the three
#                                  drop-in files. Triggers restorecon,
#                                  daemon-reload, and a unit restart, in
#                                  that order.
#   "topic_smartd exec label changed" — fires when the executable had to be
#                                  relabelled. A running process keeps the
#                                  domain it was started in, so the label
#                                  alone does not move it; only a restart does.

- name: "topic_smartd | semodule install nnp_smartd"
  ansible.builtin.command:
    argv:
      - semodule
      - "-X"
      - "{{ topic_smartd_cil_priority | string }}"
      - "-i"
      - "{{ topic_smartd_cil_dir }}/{{ topic_smartd_cil_module_name }}.cil"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_smartd cil changed"

- name: "topic_smartd | restorecon smartd drop-ins"
  # -R so the drop-in directory itself is relabelled, not only the files
  # inside it. The directory is created by this role and takes its context
  # from the parent directory at creation time; no later step revisits it.
  # -F additionally resets the SELinux user field. Without it every path
  # keeps the user identity of whoever applied the role, and that drift is
  # invisible to `restorecon -n`, which compares the type alone.
  #
  # Targeted policy ships no service-specific unit-file type for this unit,
  # so the expected type here is the generic systemd_unit_file_t that the
  # files already inherit. The relabel is still required: the user field
  # needs resetting, and the step stays correct if policy later adds a
  # specific type for this path.
  ansible.builtin.command:
    argv:
      - restorecon
      - "-F"
      - "-v"
      - "-R"
      - "{{ topic_smartd_dropin_dir }}"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_smartd dropin changed"

- name: "topic_smartd | restart smartd after an executable relabel"
  # Deliberately not relabelling the compatibility symlink alongside: entries
  # qualified with `--` match regular files only, so the generic type is the
  # correct one for the link. Pulling it along would be a drift report that
  # never resolves.
  ansible.builtin.systemd:
    name: "smartd.service"
    state: restarted
  listen: "topic_smartd exec label changed"

- name: "topic_smartd | daemon-reload"
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "topic_smartd dropin changed"

- name: "topic_smartd | restart smartd"
  ansible.builtin.systemd:
    name: "smartd.service"
    state: restarted
  listen: "topic_smartd dropin changed"
