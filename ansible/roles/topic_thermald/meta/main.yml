---
galaxy_info:
  role_name: topic_thermald
  description: "thermald hardening (three drop-ins, empty CapabilityBoundingSet, platform-symmetric Soll-state, no topic-owned CIL module)."
  license: "MIT"
  min_ansible_version: "2.14"
  platforms:
    - name: Fedora
      versions:
        - "44"
        - "45"

# Note: foundation_selinux_cil_bootstrap is intentionally absent. This
# topic ships no topic-owned CIL module — thermald runs in init_t and
# the kernel's NNP-transition constraint has no source-target distinction
# to evaluate for an identity transition. The Layer-2 CIL bootstrap
# mechanism is therefore not load-bearing for this role.
dependencies:
  - role: foundation_umask
  - role: foundation_sudo_roles
  - role: foundation_audit_logging_baseline
