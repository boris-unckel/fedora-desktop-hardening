---
# Handlers for topic_tuned.
#
# One notification channel:
#   "topic_tuned dropin changed" — fires on a change to the single
#                                   drop-in file. Triggers restorecon,
#                                   daemon-reload, and a unit restart.
#
# No semodule install handler. This topic ships no CIL module; the
# Layer-2 CIL bootstrap surface is not exercised here.

- name: "topic_tuned | restorecon tuned drop-ins"
  # -R so the drop-in directory itself is relabelled, not only the files
  # inside it. The directory is created by this role and takes its context
  # from the parent directory at creation time; no later step revisits it.
  # -F additionally resets the SELinux user field. Without it every path
  # keeps the user identity of whoever applied the role, and that drift is
  # invisible to `restorecon -n`, which compares the type alone.
  ansible.builtin.command:
    argv:
      - restorecon
      - "-F"
      - "-v"
      - "-R"
      - "{{ topic_tuned_dropin_dir }}"
  become: true
  become_flags: "-r sysadm_r -t sysadm_t"
  listen: "topic_tuned dropin changed"

- name: "topic_tuned | daemon-reload"
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "topic_tuned dropin changed"

- name: "topic_tuned | restart tuned"
  ansible.builtin.systemd:
    name: "tuned.service"
    state: restarted
  listen: "topic_tuned dropin changed"
